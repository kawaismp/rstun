[package]
name = "rstun"
version = "0.7.4"
edition = "2021"

[lib]
crate-type = ["lib"]

[dependencies]
rustls = { version = "0.23.32", default-features = false, features = ["ring"] }
clap = { version = "4.5.49", features = ["derive"] }
rcgen = "0.14.5"
tokio = { version = "1.48.0", features = ["full"] }
pretty_env_logger = "0.5.0"
ring = "0.17.14"
log = "0.4.28"
chrono = "0.4.42"
anyhow = "1.0.100"
quinn = "0.11.9"
quinn-proto = "0.11.13"
futures-util = "0.3.31"
bincode = { version = "2.0.1", features = ["serde"] }
pin-utils = "0.1.0"
enum-as-inner = "0.6.1"
num_cpus = "1.17.0"
rs-utilities = "0.4.4"
# rs-utilities = { path = "../rs-utilities" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rustls-platform-verifier = "0.6.1"
byte-pool = { git = "https://github.com/neevek/byte-pool" }
x509-parser = "0.18.0"
lazy_static = "1.5.0"
rustls-pemfile = "2.2.0"
bytes = "1.10.1"
backon = "1.5.2"
dashmap = "6.1.0"
ctrlc = "3.5.0"
parking_lot = { version = "0.12.5", features = ["serde"] }
ahash = "0.8"
libc = "0.2.177"
snap = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
jni = "0.21.1"
android_logger = "0.15.1"

[target.aarch64-linux-android.dependencies]
jni = "0.21.1"
android_logger = "0.15.1"

[target.armv7-linux-androideabi.dependencies]
jni = "0.21.1"
android_logger = "0.15.1"

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
overflow-checks = false
debug = false
