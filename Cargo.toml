[package]
name = "rstun"
version = "0.7.4"
edition = "2021"

[lib]
crate-type = ["lib"]

[dependencies]
rustls = { version = "0.23.41", default-features = false, features = ["ring"] }
clap = { version = "4.6.1", features = ["derive"] }
rcgen = "0.14.8"
tokio = { version = "1.52.3", features = ["full"] }
log = "0.4.33"
chrono = "0.4.45"
anyhow = "1.0.103"
quinn = "0.11.11"
quinn-proto = "0.11.16"
postcard = { version = "1.1.3", features = ["alloc"] }
num_cpus = "1.17.0"
rs-utilities = "0.5.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rustls-platform-verifier = "0.7.0"
byte-pool = { git = "https://github.com/neevek/byte-pool" }
x509-parser = "0.18.1"
rustls-pemfile = "2.2.0"
bytes = "1.12.1"
backon = "1.6.0"
ctrlc = "3.5.2"
parking_lot = { version = "0.12.5", features = ["serde"] }
ahash = "0.8"
libc = "0.2.186"
mimalloc = "0.1.52"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[profile.release]
opt-level = 3
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug = false
